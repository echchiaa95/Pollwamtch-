name: Build and Deploy PollWatch

on:
  push:
    branches:
      - main
    paths:
      - "*.zip"
      - ".github/workflows/deploy-pollwatch.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pollwatch-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, Deploy Pages and Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP file found in repository root."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Found project ZIP: $ZIP_FILE"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted-project
          mkdir -p extracted-project

          unzip -q "$ZIP_FILE" -d extracted-project

          echo "Project ZIP extracted successfully."
          find extracted-project -maxdepth 4 -type d | head -n 80

      - name: Locate web application
        shell: bash
        run: |
          set -euo pipefail

          WEB_DIR="$(find extracted-project -type f -name package.json \
            -not -path '*/node_modules/*' \
            -not -path '*/dist/*' \
            -printf '%h\n' | grep '/apps/web$' | head -n 1 || true)"

          if [ -z "$WEB_DIR" ]; then
            WEB_DIR="$(find extracted-project -type f -name package.json \
              -not -path '*/node_modules/*' \
              -not -path '*/dist/*' \
              -printf '%h\n' | head -n 1)"
          fi

          if [ -z "$WEB_DIR" ]; then
            echo "ERROR: Could not locate web application."
            exit 1
          fi

          echo "WEB_DIR=$WEB_DIR" >> "$GITHUB_ENV"
          echo "Web application found at: $WEB_DIR"

      - name: Locate Supabase directory
        shell: bash
        run: |
          set -euo pipefail

          SUPABASE_DIR="$(find extracted-project -type d -name supabase \
            -not -path '*/node_modules/*' | head -n 1 || true)"

          if [ -n "$SUPABASE_DIR" ]; then
            echo "SUPABASE_DIR=$SUPABASE_DIR" >> "$GITHUB_ENV"
            echo "Supabase directory found at: $SUPABASE_DIR"
          else
            echo "SUPABASE_DIR=" >> "$GITHUB_ENV"
            echo "No Supabase directory found. Supabase deployment will be skipped."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.WEB_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WEB_DIR }}
        run: npm ci

      - name: Build website
        working-directory: ${{ env.WEB_DIR }}
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$WEB_DIR/dist" ]; then
            echo "ERROR: dist directory was not created."
            exit 1
          fi

          if [ ! -f "$WEB_DIR/dist/index.html" ]; then
            echo "ERROR: dist/index.html was not created."
            exit 1
          fi

          echo "Build output verified successfully."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.WEB_DIR }}/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Setup Supabase CLI
        if: ${{ env.SUPABASE_DIR != '' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate Supabase secrets
        if: ${{ env.SUPABASE_DIR != '' }}
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail

          [ -n "$SUPABASE_ACCESS_TOKEN" ] || {
            echo "ERROR: SUPABASE_ACCESS_TOKEN is missing."
            exit 1
          }

          [ -n "$SUPABASE_PROJECT_REF" ] || {
            echo "ERROR: SUPABASE_PROJECT_REF is missing."
            exit 1
          }

          [ -n "$SUPABASE_DB_PASSWORD" ] || {
            echo "ERROR: SUPABASE_DB_PASSWORD is missing."
            exit 1
          }

          echo "Supabase secrets are available."

      - name: Login to Supabase CLI
        if: ${{ env.SUPABASE_DIR != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          supabase login \
            --token "$SUPABASE_ACCESS_TOKEN" \
            --name github-actions

          echo "Supabase CLI login completed."

      - name: Link Supabase project
        if: ${{ env.SUPABASE_DIR != '' }}
        working-directory: ${{ env.SUPABASE_DIR }}
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail

          supabase link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

          echo "Supabase project linked successfully."

      - name: Show migration files
        if: ${{ env.SUPABASE_DIR != '' }}
        working-directory: ${{ env.SUPABASE_DIR }}
        run: |
          set -euo pipefail

          if [ -d migrations ]; then
            find migrations -maxdepth 1 -type f -name '*.sql' -print | sort
          else
            echo "No migrations directory found."
          fi

      - name: Apply Supabase migrations
        if: ${{ env.SUPABASE_DIR != '' }}
        working-directory: ${{ env.SUPABASE_DIR }}
        run: |
          set -euo pipefail

          supabase db push --include-all

          echo "Supabase migrations applied successfully."

      - name: Verify deployment
        run: |
          echo "GitHub Pages deployment completed."
          echo "PollWatch deployment workflow completed."
