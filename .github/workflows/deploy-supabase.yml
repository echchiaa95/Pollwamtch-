name: Deploy ZIP to Supabase

on:
  push:
    branches:
      - main
    paths:
      - "*.zip"
      - "**/*.zip"
      - ".github/workflows/zip.supabase-migration.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-zip-deployment
  cancel-in-progress: false

jobs:
  migrate:
    name: Extract ZIP and apply Supabase migrations
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail

          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "Missing secret: SUPABASE_ACCESS_TOKEN"
            exit 1
          }

          test -n "$SUPABASE_PROJECT_REF" || {
            echo "Missing secret: SUPABASE_PROJECT_ID"
            exit 1
          }

          test -n "$SUPABASE_DB_PASSWORD" || {
            echo "Missing secret: SUPABASE_DB_PASSWORD"
            exit 1
          }

          echo "All required secrets are available."

      - name: Find project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          while IFS= read -r file; do
            case "$file" in
              *node_modules/*)
                continue
                ;;
              *.github/*)
                continue
                ;;
              *)
                ZIP_FILE="$file"
                break
                ;;
            esac
          done < <(find . -type f -name "*.zip" | sort)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file was found."
            exit 1
          fi

          echo "ZIP file found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted-project
          mkdir -p extracted-project

          unzip -q "$ZIP_FILE" -d extracted-project

          echo "ZIP extracted successfully."

      - name: Locate Supabase project directory
        shell: bash
        run: |
          set -euo pipefail

          SUPABASE_DIR=$(find extracted-project \
            -type d \
            -name "supabase" \
            -print \
            -quit)

          if [ -z "$SUPABASE_DIR" ]; then
            echo "Supabase directory was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SUPABASE_DIR")

          if [ ! -d "$SUPABASE_DIR/migrations" ]; then
            echo "Migrations directory was not found:"
            echo "$SUPABASE_DIR/migrations"
            exit 1
          fi

          echo "SUPABASE_DIR=$SUPABASE_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"
          echo "Supabase directory: $SUPABASE_DIR"

      - name: Validate migration files
        shell: bash
        run: |
          set -euo pipefail

          MIGRATION_COUNT=$(find "$SUPABASE_DIR/migrations" \
            -maxdepth 1 \
            -type f \
            -name "*.sql" \
            | wc -l)

          if [ "$MIGRATION_COUNT" -eq 0 ]; then
            echo "No SQL migrations found."
            exit 1
          fi

          echo "Found $MIGRATION_COUNT migration file(s):"

          find "$SUPABASE_DIR/migrations" \
            -maxdepth 1 \
            -type f \
            -name "*.sql" \
            -print \
            | sort

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Login to Supabase CLI
        shell: bash
        run: |
          set -euo pipefail

          supabase login \
            --token "$SUPABASE_ACCESS_TOKEN" \
            --name github-actions

          echo "Supabase CLI login completed."

      - name: Link Supabase project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          supabase link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

          echo "Supabase project linked successfully."

      - name: Show migration status before deployment
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          supabase migration list

      - name: Apply Supabase migrations
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          supabase db push --include-all

          echo "Supabase migrations applied successfully."

      - name: Verify migration status
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          supabase migration list

          echo "Migration verification completed."

      - name: Verify expected database tables
        shell: bash
        run: |
          set -euo pipefail

          echo "Migration deployment finished."
          echo "Please verify the tables from Supabase Table Editor."
