name: Deploy ZIP to Supabase

on:
  push:
    branches:
      - main
    paths:
      - "*.zip"
      - "**/*.zip"
      - ".github/workflows/zip.supabase-migration.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-zip-deployment
  cancel-in-progress: false

jobs:
  migrate:
    name: Extract ZIP and apply Supabase migrations
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "Missing secret: SUPABASE_ACCESS_TOKEN"
            exit 1
          fi

          if [ -z "${SUPABASE_PROJECT_REF}" ]; then
            echo "Missing secret: SUPABASE_PROJECT_ID"
            exit 1
          fi

          if [ -z "${SUPABASE_DB_PASSWORD}" ]; then
            echo "Missing secret: SUPABASE_DB_PASSWORD"
            exit 1
          fi

          echo "All required secrets are available."

      - name: Find project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          while IFS= read -r file; do
            case "$file" in
              *node_modules/*)
                continue
                ;;
              *.github/*)
                continue
                ;;
              *)
                ZIP_FILE="$file"
                break
                ;;
            esac
          done < <(find . -type f -name "*.zip" | sort)

          if [ -z "$ZIP_FILE" ]; then
            echo "No project ZIP file was found."
            exit 1
          fi

          echo "ZIP file found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted-project
          mkdir -p extracted-project

          unzip -q "$ZIP_FILE" -d extracted-project

          echo "ZIP extracted successfully."
          find extracted-project -maxdepth 4 -type f | sort | head -200

      - name: Locate Supabase directory
        shell: bash
        run: |
          set -euo pipefail

          SUPABASE_DIR=""

          if [ -d "extracted-project/supabase" ]; then
            SUPABASE_DIR="extracted-project/supabase"
          else
            FOUND_DIR=$(find extracted-project \
              -type d \
              -name "supabase" \
              -print \
              -quit)

            if [ -n "$FOUND_DIR" ]; then
              SUPABASE_DIR="$FOUND_DIR"
            fi
          fi

          if [ -z "$SUPABASE_DIR" ]; then
            echo "Supabase directory was not found inside the ZIP."
            exit 1
          fi

          if [ ! -d "$SUPABASE_DIR/migrations" ]; then
            echo "Missing migrations directory: $SUPABASE_DIR/migrations"
            exit 1
          fi

          echo "SUPABASE_DIR=$SUPABASE_DIR" >> "$GITHUB_ENV"
          echo "Supabase directory: $SUPABASE_DIR"

      - name: Validate migration files
        shell: bash
        run: |
          set -euo pipefail

          MIGRATION_COUNT=$(find "$SUPABASE_DIR/migrations" \
            -maxdepth 1 \
            -type f \
            -name "*.sql" \
            | wc -l)

          if [ "$MIGRATION_COUNT" -eq 0 ]; then
            echo "No SQL migration files were found."
            exit 1
          fi

          echo "Found $MIGRATION_COUNT migration file(s):"

          find "$SUPABASE_DIR/migrations" \
            -maxdepth 1 \
            -type f \
            -name "*.sql" \
            -print \
            | sort

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Login to Supabase CLI
        shell: bash
        run: |
          set -euo pipefail

          supabase login \
            --token "$SUPABASE_ACCESS_TOKEN" \
            --name github-actions

          echo "Supabase CLI login completed."

      - name: Link Supabase project
        shell: bash
        working-directory: extracted-project
        run: |
          set -euo pipefail

          supabase link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

          echo "Supabase project linked successfully."

      - name: Show migration status before deployment
        shell: bash
        working-directory: extracted-project
        run: |
          set -euo pipefail

          supabase migration list

      - name: Apply Supabase migrations
        shell: bash
        working-directory: extracted-project
        run: |
          set -euo pipefail

          supabase db push --include-all

          echo "Supabase migrations applied successfully."

      - name: Verify migration status
        shell: bash
        working-directory: extracted-project
        run: |
          set -euo pipefail

          supabase migration list

          echo "Migration verification completed."
