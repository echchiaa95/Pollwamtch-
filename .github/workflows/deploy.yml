name: Deploy PollWatch Platform

on:
  push:
    branches:
      - main
    paths:
      - "**/*.zip"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/*.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pollwatch-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy PollWatch
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "ERROR: SUPABASE_ACCESS_TOKEN secret is missing."
            exit 1
          fi

          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "ERROR: SUPABASE_PROJECT_REF secret is missing."
            exit 1
          fi

          echo "Required secrets are available."

      - name: Find project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 3 -type f -iname "*.zip" \
            ! -path "./.git/*" \
            | head -n 1)"

          if [ -z "${ZIP_FILE}" ]; then
            echo "ERROR: No project ZIP file was found."
            exit 1
          fi

          echo "ZIP_FILE=${ZIP_FILE}" >> "$GITHUB_ENV"
          echo "Found project ZIP: ${ZIP_FILE}"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted-project
          mkdir -p extracted-project

          unzip -q "$ZIP_FILE" -d extracted-project

          echo "Extracted project structure:"
          find extracted-project -maxdepth 4 -type f \
            \( -name "package.json" -o -name "vite.config.*" -o -name "supabase" \) \
            -print || true

      - name: Locate web application
        shell: bash
        run: |
          set -euo pipefail

          WEB_PACKAGE_JSON="$(find extracted-project -type f \
            -name "package.json" \
            ! -path "*/node_modules/*" \
            | while read -r file; do
                if grep -q '"build"' "$file" 2>/dev/null; then
                  echo "$file"
                  break
                fi
              done)"

          if [ -z "${WEB_PACKAGE_JSON}" ]; then
            echo "ERROR: Could not locate the web application's package.json."
            find extracted-project -type f -name "package.json" -print
            exit 1
          fi

          WEB_DIR="$(dirname "$WEB_PACKAGE_JSON")"

          echo "WEB_DIR=${WEB_DIR}" >> "$GITHUB_ENV"
          echo "Located web application at: ${WEB_DIR}"

      - name: Locate Supabase project
        shell: bash
        run: |
          set -euo pipefail

          SUPABASE_DIR="$(find extracted-project -type d \
            -path "*/supabase" \
            ! -path "*/node_modules/*" \
            | head -n 1)"

          if [ -z "${SUPABASE_DIR}" ]; then
            echo "ERROR: Could not locate the Supabase directory."
            find extracted-project -maxdepth 6 -type d -name "supabase" -print
            exit 1
          fi

          if [ ! -d "${SUPABASE_DIR}/migrations" ]; then
            echo "ERROR: Supabase migrations directory does not exist:"
            echo "${SUPABASE_DIR}/migrations"
            exit 1
          fi

          echo "SUPABASE_DIR=${SUPABASE_DIR}" >> "$GITHUB_ENV"
          echo "Located Supabase project at: ${SUPABASE_DIR}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.WEB_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WEB_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build website
        working-directory: ${{ env.WEB_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          npm run build

          if [ ! -d "dist" ]; then
            echo "ERROR: Build completed but dist directory was not created."
            find . -maxdepth 3 -type d -name "dist" -print
            exit 1
          fi

          echo "Website build completed successfully."
          ls -la dist

      - name: Prepare GitHub Pages artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf pages-dist
          mkdir -p pages-dist

          cp -R "${WEB_DIR}/dist/." pages-dist/

          if [ ! -f "pages-dist/index.html" ]; then
            echo "ERROR: pages-dist/index.html was not found."
            find pages-dist -maxdepth 2 -type f -print
            exit 1
          fi

          echo "GitHub Pages artifact prepared successfully."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-dist

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Login to Supabase CLI
        shell: bash
        run: |
          set -euo pipefail

          supabase login \
            --token "$SUPABASE_ACCESS_TOKEN" \
            --name github-actions

          echo "Supabase CLI login completed."

      - name: Link Supabase project
        working-directory: ${{ env.SUPABASE_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          supabase link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

          echo "Supabase project linked successfully."

      - name: Show migration files
        working-directory: ${{ env.SUPABASE_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Available migration files:"
          find migrations -maxdepth 1 -type f -name "*.sql" \
            -printf "%f\n" | sort

      - name: Apply Supabase migrations
        working-directory: ${{ env.SUPABASE_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          supabase db push --include-all

          echo "Supabase migrations applied successfully."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployment
        shell: bash
        run: |
          set -euo pipefail

          echo "PollWatch deployment completed."
          echo "GitHub Pages URL:"
          echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
