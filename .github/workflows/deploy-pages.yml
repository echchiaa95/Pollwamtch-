name: Deploy PollWatch to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect application directory
        id: detect
        shell: bash
        run: |
          set -e

          if [ -f "apps/web/package.json" ]; then
            APP_DIR="apps/web"
          elif [ -f "package.json" ]; then
            APP_DIR="."
          else
            APP_DIR="$(find . -name package.json -not -path '*/node_modules/*' -printf '%h\n' | head -n 1)"
          fi

          if [ -z "$APP_DIR" ] || [ ! -f "$APP_DIR/package.json" ]; then
            echo "package.json was not found"
            exit 1
          fi

          echo "APP_DIR=$APP_DIR"
          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: ${{ steps.detect.outputs.app_dir }}
        run: npm ci

      - name: Build application
        working-directory: ${{ steps.detect.outputs.app_dir }}
        run: npm run build

      - name: Verify build output
        working-directory: ${{ steps.detect.outputs.app_dir }}
        run: |
          if [ ! -d "dist" ]; then
            echo "dist directory was not created"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.detect.outputs.app_dir }}/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
