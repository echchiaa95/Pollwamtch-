name: Deploy PollWatch to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find and extract ZIP
        id: extract
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo "ZIP file found: $ZIP_FILE"

          mkdir -p extracted-project
          unzip -q "$ZIP_FILE" -d extracted-project

          echo "Searching for package.json..."

          PACKAGE_JSON="$(find extracted-project \
            -type f \
            -name package.json \
            -not -path '*/node_modules/*' \
            | head -n 1)"

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json was not found inside the ZIP."
            exit 1
          fi

          APP_DIR="$(dirname "$PACKAGE_JSON")"

          echo "Application directory: $APP_DIR"
          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: ${{ steps.extract.outputs.app_dir }}
        run: npm ci

      - name: Build application
        working-directory: ${{ steps.extract.outputs.app_dir }}
        run: npm run build

      - name: Verify dist directory
        working-directory: ${{ steps.extract.outputs.app_dir }}
        run: |
          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory was not created."
            exit 1
          fi

          echo "Build output verified successfully."
          find dist -maxdepth 2 -type f -print

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.extract.outputs.app_dir }}/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
