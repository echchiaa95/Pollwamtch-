name: Deploy PollWatch to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find application directory
        id: detect
        shell: bash
        run: |
          set -e

          echo "Repository structure:"
          find . -maxdepth 5 -type f \( -name "package.json" -o -name "package-lock.json" \) -print

          PACKAGE_JSON="$(find . -type f -name package.json \
            -not -path "*/node_modules/*" \
            -not -path "*/.git/*" \
            | head -n 1)"

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json was not found anywhere in the repository."
            exit 1
          fi

          APP_DIR="$(dirname "$PACKAGE_JSON")"

          echo "Found package.json: $PACKAGE_JSON"
          echo "Application directory: $APP_DIR"

          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: ${{ steps.detect.outputs.app_dir }}
        run: npm ci

      - name: Build application
        working-directory: ${{ steps.detect.outputs.app_dir }}
        run: npm run build

      - name: Verify build output
        working-directory: ${{ steps.detect.outputs.app_dir }}
        run: |
          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory was not created."
            exit 1
          fi

          echo "Build output verified:"
          find dist -maxdepth 2 -type f -print

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.detect.outputs.app_dir }}/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
