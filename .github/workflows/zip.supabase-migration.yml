name: Deploy ZIP to Supabase

on:
  push:
    branches:
      - main
    paths:
      - "*.zip"
      - "**/*.zip"
      - ".github/workflows/zip-supabase-migration.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-zip-deployment
  cancel-in-progress: false

jobs:
  migrate:
    name: Extract ZIP and apply Supabase migrations
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Error: SUPABASE_ACCESS_TOKEN is missing."
            exit 1
          fi

          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "Error: SUPABASE_PROJECT_ID is missing."
            exit 1
          fi

          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Error: SUPABASE_DB_PASSWORD is missing."
            exit 1
          fi

          echo "All required secrets are available."

      - name: Find project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' \
            ! -path './.git/*' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "Error: No ZIP file was found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Found ZIP file: $ZIP_FILE"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted-project
          mkdir -p extracted-project

          unzip -q "$ZIP_FILE" -d extracted-project

          echo "ZIP extracted successfully."

      - name: Locate Supabase directory
        shell: bash
        run: |
          set -euo pipefail

          SUPABASE_DIR="$(find extracted-project \
            -type d -path '*/supabase' | head -n 1)"

          if [ -z "$SUPABASE_DIR" ]; then
            echo "Error: The supabase directory was not found."
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SUPABASE_DIR")"

          echo "SUPABASE_DIR=$SUPABASE_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Supabase directory: $SUPABASE_DIR"
          echo "Project root: $PROJECT_ROOT"

      - name: Validate migrations
        shell: bash
        run: |
          set -euo pipefail

          MIGRATIONS_DIR="$SUPABASE_DIR/migrations"

          if [ ! -d "$MIGRATIONS_DIR" ]; then
            echo "Error: migrations directory was not found."
            exit 1
          fi

          if ! find "$MIGRATIONS_DIR" -maxdepth 1 \
            -type f -name '*.sql' | grep -q .; then
            echo "Error: No SQL migration files were found."
            exit 1
          fi

          echo "Migration files:"
          find "$MIGRATIONS_DIR" -maxdepth 1 \
            -type f -name '*.sql' -print

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Login to Supabase CLI
        shell: bash
        run: |
          set -euo pipefail

          supabase login \
            --token "$SUPABASE_ACCESS_TOKEN" \
            --name github-actions

          echo "Supabase CLI login completed."

      - name: Link Supabase project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          supabase link \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Check migration status
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          supabase migration list

      - name: Apply database migrations
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          supabase db push --include-all

      - name: Verify migration status
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          supabase migration list

      - name: Deployment summary
        shell: bash
        run: |
          echo "Supabase migrations were applied successfully."
